primary_hostname = mail.test
domainlist local_domains = mail.test : localhost
acl_smtp_rcpt = local_only
begin acl
local_only:
  accept domains = +local_domains
  deny message = relay denied
begin routers
local_user:
  driver = accept
  domains = +local_domains
  local_parts = probe
  check_local_user
  transport = maildir
begin transports
maildir:
  driver = appendfile
  directory = /home/probe/Maildir
  maildir_format
  create_directory
  user = probe
  mode = 0600
begin retry
* * F,2h,15m
